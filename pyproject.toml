[tool.ruff]
# Target Python version
target-version = "py313"

# Formatting settings (match Black)
line-length = 88
indent-width = 4

# Exclude only project-specific or non-standard directories
exclude = [
    "stats/templates",
    "web/static",
    "web/templates",
]

[tool.ruff.lint]
# ULTIMATE STRICTNESS: Enable every available rule
select = ["ALL"]

# Only ignore rules that directly conflict or are not recommended with the formatter
ignore = [
    "D203",   # Conflicts with D211 (one-blank-line-before-class)
    "D212",   # Conflicts with D213 (multi-line-summary-first-line)
    "COM812", # Recommended to disable when using ruff format
    "ISC001", # Recommended to disable when using ruff format
]

# Allow fix for all enabled rules
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pylint.master]
ignore = ["CVS"]
persistent = "yes"
load-plugins = []

[tool.pylint.format]
# Use double quotes for strings in Pylint to match Ruff/Black
string-quote = "double"
max-line-length = 88

[tool.pylint.messages_control]
# Maximum strictness: no disabled rules
disable = []
